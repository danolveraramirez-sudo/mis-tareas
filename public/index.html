<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tareas</title>
<style>
  :root {
    --bg:#f4f5fa;
    --grad-a:#e9e6ff;
    --grad-b:#e3f4ff;
    --card:#ffffff;
    --text:#1f2333;
    --muted:#7a8095;
    --accent:#6c5ce7;
    --accent2:#a29bfe;
    --danger:#e5534b;
    --danger-bg:#fdecea;
    --line:#eceef4;
    --input-bg:#ffffff;
    --shadow:0 20px 50px rgba(60,50,140,.12);
    --icon-bg:#f1f0fb;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg:#0f1117;
    --grad-a:#1a1633;
    --grad-b:#101f2e;
    --card:#1a1d27;
    --text:#eceef6;
    --muted:#9aa0b5;
    --accent:#8b7bff;
    --accent2:#b3aaff;
    --danger:#ff6b61;
    --danger-bg:#3a2220;
    --line:#2a2e3c;
    --input-bg:#12141c;
    --shadow:0 20px 50px rgba(0,0,0,.45);
    --icon-bg:#262a38;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height:100%; }
  body {
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--grad-a) 0%, var(--bg) 50%, var(--grad-b) 100%);
    background-attachment: fixed;
    color: var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 16px;
    transition: background-color .25s, color .25s;
  }
  .card {
    position:relative;
    width:100%;
    max-width:640px;
    background:var(--card);
    border-radius:22px;
    padding:32px;
    box-shadow:var(--shadow);
    transition: background-color .25s, box-shadow .25s;
  }
  .tema {
    position:absolute;
    top:20px;
    right:20px;
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:var(--icon-bg);
    color:var(--text);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition: background-color .2s, transform .15s;
  }
  .tema:hover { transform: scale(1.08); }
  .tema:active { transform: scale(.95); }
  header { padding-right:56px; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.02em; }
  .sub { margin:0 0 24px; color:var(--muted); font-size:15px; }
  form { display:flex; gap:10px; margin-bottom:20px; }
  input[type=text] {
    flex:1;
    min-width:0;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:14px;
    background:var(--input-bg);
    color:var(--text);
    font-size:16px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, background-color .2s;
  }
  input[type=text]::placeholder { color:var(--muted); }
  input[type=text]:focus { border-color:var(--accent2); }
  button.add {
    padding:0 22px;
    min-height:48px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;
    font-weight:600;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    transition:filter .2s, transform .15s;
  }
  button.add:hover { filter:brightness(1.07); }
  button.add:active { transform:scale(.98); }
  ul { list-style:none; margin:0; padding:0; }
  li {
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 6px;
    border-bottom:1px solid var(--line);
  }
  li:last-child { border-bottom:0; }
  .check {
    width:26px;
    height:26px;
    border-radius:50%;
    border:2px solid var(--accent2);
    background:none;
    cursor:pointer;
    display:grid;
    place-items:center;
    color:#fff;
    font-size:14px;
    flex-shrink:0;
    padding:0;
    transition:background-color .2s, border-color .2s;
  }
  li.hecha .check { background:var(--accent); border-color:var(--accent); }
  .texto { flex:1; font-size:16px; word-break:break-word; }
  li.hecha .texto { text-decoration:line-through; color:var(--muted); }
  .del {
    border:0;
    background:none;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    border-radius:10px;
    padding:6px 10px;
    flex-shrink:0;
    transition:color .2s, background-color .2s;
  }
  .del:hover { color:var(--danger); background:var(--danger-bg); }
  .vacio { text-align:center; color:var(--muted); padding:32px 0; font-size:15px; }
  footer {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:14px;
    color:var(--muted);
    flex-wrap:wrap;
  }
  footer button {
    border:0;
    background:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
    padding:10px 12px;
    border-radius:10px;
    min-height:40px;
    transition:color .2s, background-color .2s;
  }
  footer button:hover { color:var(--danger); background:var(--danger-bg); }
  @media (max-width:520px) {
    body { padding:16px 12px; }
    .card { padding:22px 18px; border-radius:18px; }
    h1 { font-size:24px; }
    .tema { top:16px; right:16px; }
    form { flex-wrap:wrap; }
    button.add { flex:1 1 100%; }
    .check { width:40px; height:40px; }
    .del { min-width:40px; min-height:40px; display:grid; place-items:center; }
    li { padding:12px 2px; }
  }
</style>
</head>
<body>
<main class="card">
  <button class="tema" id="tema" type="button" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
  <header>
    <h1>Mis tareas ✓</h1>
    <p class="sub" id="fecha"></p>
  </header>
  <form id="form">
    <input type="text" id="nueva" placeholder="¿Qué necesitas hacer?" maxlength="200" autocomplete="off" autofocus>
    <button class="add" type="submit">Agregar</button>
  </form>
  <ul id="lista"></ul>
  <footer><span id="contador"></span><button id="limpiar" type="button">Borrar completadas</button></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (url, opts={}) => fetch(url, { headers:{'Content-Type':'application/json'}, ...opts });

(function initTema() {
  const guardado = localStorage.getItem('tema');
  const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const tema = guardado || (prefiereOscuro ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', tema);
  actualizarIcono(tema);
})();

function actualizarIcono(tema) {
  const btn = $('#tema');
  btn.textContent = tema === 'dark' ? '☀️' : '🌙';
}

$('#tema').onclick = () => {
  const actual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', actual);
  localStorage.setItem('tema', actual);
  actualizarIcono(actual);
};

$('#fecha').textContent = new Date().toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });

async function cargar() {
  const tareas = await (await api('/api/tareas')).json();
  const ul = $('#lista');
  ul.textContent = '';

  if (!tareas.length) {
    const li = document.createElement('li');
    li.className = 'vacio';
    li.textContent = 'No tienes tareas. ¡Agrega la primera! 🎉';
    ul.appendChild(li);
  } else {
    for (const t of tareas) {
      const li = document.createElement('li');
      if (t.hecha) li.className = 'hecha';

      const check = document.createElement('button');
      check.className = 'check';
      check.type = 'button';
      check.title = t.hecha ? 'Marcar pendiente' : 'Marcar hecha';
      check.textContent = t.hecha ? '✓' : '';
      check.onclick = async () => {
        await api('/api/tareas/' + t.id, { method:'PATCH', body: JSON.stringify({ hecha: !t.hecha }) });
        cargar();
      };

      const texto = document.createElement('span');
      texto.className = 'texto';
      texto.textContent = t.texto;

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.title = 'Eliminar';
      del.textContent = '✕';
      del.onclick = async () => {
        await api('/api/tareas/' + t.id, { method:'DELETE' });
        cargar();
      };

      li.append(check, texto, del);
      ul.appendChild(li);
    }
  }

  const pend = tareas.filter(t => !t.hecha).length;
  $('#contador').textContent = `${pend} pendiente${pend === 1 ? '' : 's'} de ${tareas.length}`;
}

$('#form').onsubmit = async e => {
  e.preventDefault();
  const texto = $('#nueva').value.trim();
  if (!texto) return;
  await api('/api/tareas', { method:'POST', body: JSON.stringify({ texto }) });
  $('#nueva').value = '';
  cargar();
};

$('#limpiar').onclick = async () => {
  await api('/api/tareas?hechas=1', { method:'DELETE' });
  cargar();
};

cargar();
</script>
</body>
</html>
