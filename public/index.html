<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tareas</title>
<style>
  :root {
    --bg:#f4f5fa;
    --grad-a:#e9e6ff;
    --grad-b:#e3f4ff;
    --card:#ffffff;
    --text:#1f2333;
    --muted:#7a8095;
    --accent:#6c5ce7;
    --accent2:#a29bfe;
    --danger:#e5534b;
    --danger-bg:#fdecea;
    --line:#eceef4;
    --input-bg:#ffffff;
    --shadow:0 20px 50px rgba(60,50,140,.12);
    --icon-bg:#f1f0fb;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg:#0f1117;
    --grad-a:#1a1633;
    --grad-b:#101f2e;
    --card:#1a1d27;
    --text:#eceef6;
    --muted:#9aa0b5;
    --accent:#8b7bff;
    --accent2:#b3aaff;
    --danger:#ff6b61;
    --danger-bg:#3a2220;
    --line:#2a2e3c;
    --input-bg:#12141c;
    --shadow:0 20px 50px rgba(0,0,0,.45);
    --icon-bg:#262a38;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html {
    min-height:100%;
    background: linear-gradient(135deg, var(--grad-a) 0%, var(--bg) 50%, var(--grad-b) 100%);
    background-attachment: fixed;
  }
  body {
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 16px;
    min-height:100%;
    transition: color .25s;
  }
  .card {
    position:relative;
    width:100%;
    max-width:640px;
    background:var(--card);
    border-radius:22px;
    padding:32px;
    box-shadow:var(--shadow);
    transition: background-color .25s, box-shadow .25s;
  }
  .tema {
    position:absolute;
    top:20px;
    right:20px;
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:var(--icon-bg);
    color:var(--text);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition: background-color .2s, transform .15s;
  }
  .tema:hover { transform: scale(1.08); }
  .tema:active { transform: scale(.95); }
  header { padding-right:56px; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.02em; }
  .sub { margin:0 0 24px; color:var(--muted); font-size:15px; }
  .stats-panel { margin:-8px 0 16px; }
  .stats {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(88px, 1fr));
    gap:10px;
  }
  .stat {
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:10px 12px;
    background:var(--icon-bg);
    border:1px solid var(--line);
    border-radius:14px;
    transition:background-color .25s, border-color .25s;
  }
  .stat-valor {
    font-size:22px;
    font-weight:700;
    line-height:1.1;
    letter-spacing:-.02em;
  }
  .stat-label {
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat-barra {
    margin-top:4px;
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .stat-barra span {
    display:block;
    height:100%;
    width:0;
    border-radius:999px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    transition:width .4s ease;
  }
  .stats-aviso {
    margin:10px 0 0;
    padding:6px 10px;
    border:1px solid var(--danger);
    border-radius:10px;
    background:var(--danger-bg);
    color:var(--danger);
    font-size:13px;
    font-weight:600;
  }
  form { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .form-row { display:flex; gap:10px; flex:1 1 100%; flex-wrap:wrap; }
  input[type=text] {
    flex:2 1 200px;
    min-width:0;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:14px;
    background:var(--input-bg);
    color:var(--text);
    font-size:16px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, background-color .2s;
  }
  input[type=text]::placeholder { color:var(--muted); }
  input[type=text]:focus { border-color:var(--accent2); }
  button.add {
    padding:0 22px;
    min-height:48px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;
    font-weight:600;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    transition:filter .2s, transform .15s;
  }
  button.add:hover { filter:brightness(1.07); }
  button.add:active { transform:scale(.98); }
  select.cat-nueva {
    flex:0 1 120px;
    min-width:0;
    padding:0 10px;
    min-height:48px;
    border:1.5px solid var(--line);
    border-radius:14px;
    background:var(--input-bg);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    outline:none;
    cursor:pointer;
    transition:border-color .2s, background-color .2s;
  }
  select.cat-nueva:focus { border-color:var(--accent2); }
  select.prior-nueva {
    flex:0 1 110px;
    min-width:0;
    padding:0 10px;
    min-height:48px;
    border:1.5px solid var(--line);
    border-radius:14px;
    background:var(--input-bg);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    outline:none;
    cursor:pointer;
    transition:border-color .2s, background-color .2s;
  }
  select.prior-nueva:focus { border-color:var(--accent2); }
  input[type=date] {
    flex:0 1 150px;
    min-width:0;
    padding:0 10px;
    min-height:48px;
    border:1.5px solid var(--line);
    border-radius:14px;
    background:var(--input-bg);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, background-color .2s;
  }
  input[type=date]:focus { border-color:var(--accent2); }
  .barra {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .campo-buscar {
    position:relative;
    flex:1 1 210px;
    min-width:0;
    display:flex;
    align-items:center;
  }
  .campo-buscar .icono-buscar {
    position:absolute;
    left:12px;
    font-size:14px;
    line-height:1;
    pointer-events:none;
    opacity:.75;
  }
  .campo-buscar input {
    width:100%;
    min-width:0;
    padding:10px 12px 10px 34px;
    border:1.5px solid var(--line);
    border-radius:999px;
    background:var(--input-bg);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .2s, background-color .2s;
  }
  .campo-buscar input::placeholder { color:var(--muted); }
  .campo-buscar input:focus { border-color:var(--accent2); }
  .segmentado {
    display:flex;
    flex:0 1 auto;
    gap:4px;
    padding:4px;
    background:var(--icon-bg);
    border-radius:999px;
  }
  .seg-btn {
    border:0;
    background:none;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    line-height:1.3;
    transition:background-color .2s, color .2s, box-shadow .15s, transform .1s;
  }
  .seg-btn:hover { color:var(--text); }
  .seg-btn.activo {
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;
    box-shadow:0 2px 6px rgba(108,92,231,.35);
  }
  .seg-btn.activo:hover { color:#fff; }
  .filtros { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip {
    border:1px solid var(--line);
    background:var(--icon-bg);
    color:var(--muted);
    padding:6px 13px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    line-height:1.3;
    transition:box-shadow .15s, transform .1s, background-color .2s, color .2s;
  }
  .chip:hover { transform:translateY(-1px); }
  .chip.activo { box-shadow:0 0 0 2px var(--accent); background:var(--accent); color:#fff; border-color:transparent; }
  .pill {
    display:inline-flex;
    align-items:center;
    max-width:120px;
    padding:3px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    font-family:inherit;
    line-height:1.4;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:transform .1s;
  }
  .pill:hover { transform:scale(1.05); }
  .pill-add {
    border:1px dashed var(--line);
    background:none;
    color:var(--muted);
    font-size:14px;
    line-height:1;
    padding:5px 8px;
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
    transition:color .2s, border-color .2s;
  }
  .pill-add:hover { color:var(--accent); border-color:var(--accent2); }
  select.cat-sel {
    flex-shrink:0;
    max-width:150px;
    padding:4px 8px;
    border:1.5px solid var(--accent2);
    border-radius:999px;
    background:var(--input-bg);
    color:var(--text);
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    outline:none;
    cursor:pointer;
  }
  ul { list-style:none; margin:0; padding:0; }
  li {
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 6px;
    border-bottom:1px solid var(--line);
  }
  li:last-child { border-bottom:0; }
  .check {
    width:26px;
    height:26px;
    border-radius:50%;
    border:2px solid var(--accent2);
    background:none;
    cursor:pointer;
    display:grid;
    place-items:center;
    color:#fff;
    font-size:14px;
    flex-shrink:0;
    padding:0;
    transition:background-color .2s, border-color .2s;
  }
  li.hecha .check { background:var(--accent); border-color:var(--accent); }
  .texto { flex:1; font-size:16px; word-break:break-word; }
  li.hecha .texto { text-decoration:line-through; color:var(--muted); }
  .del {
    border:0;
    background:none;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    border-radius:10px;
    padding:6px 10px;
    flex-shrink:0;
    transition:color .2s, background-color .2s;
  }
  .del:hover { color:var(--danger); background:var(--danger-bg); }
  .vacio { text-align:center; color:var(--muted); padding:32px 0; font-size:15px; }
  footer {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:14px;
    color:var(--muted);
    flex-wrap:wrap;
  }
  footer button {
    border:0;
    background:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
    padding:10px 12px;
    border-radius:10px;
    min-height:40px;
    transition:color .2s, background-color .2s;
  }
  footer button:hover { color:var(--danger); background:var(--danger-bg); }
  @media (max-width:520px) {
    body { padding:16px 12px; }
    .card { padding:22px 18px; border-radius:18px; }
    h1 { font-size:24px; }
    .stat { padding:8px 10px; }
    .stat-valor { font-size:19px; }
    .tema { top:16px; right:16px; }
    form { flex-wrap:wrap; }
    select.cat-nueva, select.prior-nueva, input[type=date] { flex:1 1 140px; }
    button.add { flex:1 1 100%; }
    .barra { gap:8px; }
    .campo-buscar { flex:1 1 100%; }
    .segmentado { flex:1 1 100%; }
    .seg-btn { flex:1 1 0; text-align:center; padding:9px 10px; }
    .check { width:40px; height:40px; }
    .del { min-width:40px; min-height:40px; display:grid; place-items:center; }
    li { padding:12px 2px; }
  }
</style>
</head>
<body>
<main class="card">
  <button class="tema" id="tema" type="button" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
  <header>
    <h1>Mis tareas ✓</h1>
    <p class="sub" id="fecha"></p>
  </header>
  <div class="stats-panel">
    <div class="stats">
      <div class="stat">
        <span class="stat-valor" id="statPend">0</span>
        <span class="stat-label">Pendientes</span>
      </div>
      <div class="stat">
        <span class="stat-valor" id="statHoy">0</span>
        <span class="stat-label">Hechas hoy</span>
      </div>
      <div class="stat">
        <span class="stat-valor" id="statProg">0%</span>
        <span class="stat-label">Progreso</span>
        <div class="stat-barra" id="statBarraWrap" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="statBarra"></span></div>
      </div>
    </div>
    <p class="stats-aviso" id="statsAviso" hidden></p>
  </div>
   <form id="form">
     <div class="form-row">
       <input type="text" id="nueva" placeholder="¿Qué necesitas hacer?" maxlength="200" autocomplete="off" autofocus>
       <select id="catNueva" class="cat-nueva" aria-label="Categoría" title="Categoría"></select>
       <select id="priorNueva" class="prior-nueva" aria-label="Prioridad" title="Prioridad">
         <option value="alta">Alta</option>
         <option value="media" selected>Media</option>
         <option value="baja">Baja</option>
       </select>
       <input type="date" id="venceNueva" aria-label="Fecha límite" title="Fecha límite">
       <button class="add" type="submit">Agregar</button>
     </div>
   </form>
  <div class="barra">
    <div class="campo-buscar">
      <span class="icono-buscar" aria-hidden="true">🔍</span>
      <input type="search" id="buscar" placeholder="Buscar tareas…" autocomplete="off" aria-label="Buscar tareas" title="Buscar tareas">
    </div>
    <div class="segmentado" id="segmentado" role="group" aria-label="Filtrar por estado">
      <button type="button" class="seg-btn" data-estado="todas">Todas</button>
      <button type="button" class="seg-btn" data-estado="pendientes">Pendientes</button>
      <button type="button" class="seg-btn" data-estado="completadas">Completadas</button>
    </div>
  </div>
  <div class="filtros" id="filtros"></div>
  <ul id="lista"></ul>
  <footer><span id="contador"></span><button id="limpiar" type="button">Borrar completadas</button></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (url, opts={}) => fetch(url, { headers:{'Content-Type':'application/json'}, ...opts });

const CATEGORIAS = { Trabajo:'#3b82f6', Personal:'#8b5cf6', Casa:'#f59e0b', Compras:'#10b981', Salud:'#ef4444', Estudio:'#06b6d4' };
const COLOR_GRIS = '#94a3b8';
const PRIOR_COLOR = { alta:'#ef4444', media:'#f59e0b', baja:'#10b981' };
let filtro = '';

const ESTADO_KEY = 'estado';
const ESTADOS = ['todas', 'pendientes', 'completadas'];
const estadoGuardado = localStorage.getItem(ESTADO_KEY);
let estado = ESTADOS.indexOf(estadoGuardado) !== -1 ? estadoGuardado : 'todas';
let busqueda = '';
let tareasGuardadas = [];

const sinAcentos = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

const catDe = t => (typeof t.categoria === 'string' ? t.categoria.trim() : '');
const colorDe = cat => CATEGORIAS[cat] || COLOR_GRIS;
const prioDe = t => (t && typeof t.prioridad === 'string' && (t.prioridad === 'alta' || t.prioridad === 'media' || t.prioridad === 'baja')) ? t.prioridad : 'media';

(function initTema() {
  const guardado = localStorage.getItem('tema');
  const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const tema = guardado || (prefiereOscuro ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', tema);
  actualizarIcono(tema);
})();

function actualizarIcono(tema) {
  const btn = $('#tema');
  btn.textContent = tema === 'dark' ? '☀️' : '🌙';
}

$('#tema').onclick = () => {
  const actual = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', actual);
  localStorage.setItem('tema', actual);
  actualizarIcono(actual);
};

$('#fecha').textContent = new Date().toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });

(function initSelectNueva() {
  const sel = $('#catNueva');
  const vacia = document.createElement('option');
  vacia.value = '';
  vacia.textContent = 'Sin categoría';
  sel.appendChild(vacia);
  for (const nombre of Object.keys(CATEGORIAS)) {
    const o = document.createElement('option');
    o.value = nombre;
    o.textContent = nombre;
    sel.appendChild(o);
  }
})();

function crearEtiqueta(t) {
  const cat = catDe(t);
  const c = colorDe(cat);
  const btn = document.createElement('button');
  btn.type = 'button';
  if (cat) {
    btn.className = 'pill';
    btn.textContent = cat;
    btn.title = 'Cambiar categoría';
    btn.style.background = c + '2e';
    btn.style.border = '1px solid ' + c + '66';
    btn.style.color = c;
  } else {
    btn.className = 'pill-add';
    btn.textContent = '🏷️';
    btn.title = 'Asignar categoría';
  }
  btn.onclick = () => abrirSelectorCat(btn, t);
  return btn;
}

function abrirSelectorCat(nodo, t) {
  const li = nodo.closest('li');
  if (!li || li.dataset.catEdit === 'true') return;
  li.dataset.catEdit = 'true';

  const sel = document.createElement('select');
  sel.className = 'cat-sel';
  sel.setAttribute('aria-label', 'Categoría');
  const op0 = document.createElement('option');
  op0.value = '';
  op0.textContent = 'Sin categoría';
  sel.appendChild(op0);
  for (const nombre of Object.keys(CATEGORIAS)) {
    const o = document.createElement('option');
    o.value = nombre;
    o.textContent = nombre;
    sel.appendChild(o);
  }
  sel.value = catDe(t);

  let cerrado = false;
  const restaurar = () => {
    if (cerrado) return;
    cerrado = true;
    li.dataset.catEdit = 'false';
    if (sel.isConnected) li.replaceChild(nodo, sel);
  };

  sel.onchange = async () => {
    if (cerrado) return;
    cerrado = true;
    const val = sel.value;
    li.dataset.catEdit = 'false';
    if (val === catDe(t)) {
      if (sel.isConnected) li.replaceChild(nodo, sel);
      return;
    }
    await api('/api/tareas/' + t.id, { method:'PATCH', body: JSON.stringify({ categoria: val }) });
    cargar();
  };
  sel.onblur = restaurar;
  sel.onkeydown = e => {
    if (e.key === 'Escape') { e.preventDefault(); restaurar(); }
  };

  li.replaceChild(sel, nodo);
  sel.focus();
}

function pintarFiltros() {
  const cont = $('#filtros');
  cont.textContent = '';

  const nombres = ['', ...Object.keys(CATEGORIAS)];
  for (const nombre of nombres) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = nombre || 'Todas';
    const activo = filtro === nombre;
    if (nombre) {
      const c = CATEGORIAS[nombre];
      chip.style.background = activo ? c : c + '24';
      chip.style.border = '1px solid ' + (activo ? c : c + '59');
      chip.style.color = activo ? '#fff' : c;
      if (activo) chip.style.boxShadow = '0 0 0 2px ' + c + '66';
    } else if (activo) {
      chip.classList.add('activo');
    }
    chip.onclick = () => {
      if (filtro === nombre) return;
      filtro = nombre;
      render();
    };
    cont.appendChild(chip);
  }
}

const ORDEN_KEY = 'orden';
let orden = localStorage.getItem(ORDEN_KEY) || 'recientes';

let selectorOrdenCreado = false;
let contOrdenRef = null;

function fmtFechaCorta(dStr) {
  if (!dStr || typeof dStr !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return null;
  const y = parseInt(dStr.slice(0,4),10);
  const m = parseInt(dStr.slice(5,7),10)-1;
  const da = parseInt(dStr.slice(8,10),10);
  const f = new Date(y,m,da);
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const manana = new Date(hoy);
  manana.setDate(hoy.getDate()+1);
  f.setHours(0,0,0,0);
  if (f.getTime() === hoy.getTime()) return 'Hoy';
  if (f.getTime() === manana.getTime()) return 'Mañana';
  return f.toLocaleDateString('es-ES', { day:'numeric', month:'short' }).replace('.', '');
}

function esVencida(t) {
  if (t.hecha) return false;
  const dStr = t.vence;
  if (!dStr || typeof dStr !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return false;
  const y = parseInt(dStr.slice(0,4),10);
  const m = parseInt(dStr.slice(5,7),10)-1;
  const da = parseInt(dStr.slice(8,10),10);
  const f = new Date(y,m,da);
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  f.setHours(0,0,0,0);
  return f < hoy;
}

function crearSelectorOrden() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; align-items:center; gap:8px; margin-bottom:8px;';
  const label = document.createElement('span');
  label.textContent = 'Ordenar por:';
  label.style.cssText = 'color:var(--muted); font-size:13px;';
  const sel = document.createElement('select');
  sel.id = 'ordenSel';
  sel.style.cssText = 'padding:4px 8px; border:1.5px solid var(--line); border-radius:10px; background:var(--input-bg); color:var(--text); font-size:13px; font-family:inherit;';
  const opts = [
    {v:'recientes', t:'Más recientes'},
    {v:'prioridad', t:'Prioridad'},
    {v:'vence', t:'Fecha límite'},
    {v:'alfabetico', t:'Alfabético'}
  ];
  for (const o of opts) {
    const opt = document.createElement('option');
    opt.value = o.v; opt.textContent = o.t; sel.appendChild(opt);
  }
  sel.value = orden;
  sel.onchange = () => {
    orden = sel.value;
    localStorage.setItem(ORDEN_KEY, orden);
    render();
  };
  wrap.appendChild(label); wrap.appendChild(sel);
  return wrap;
}

function activarEdicion(li, span, t) {
  if (li.dataset.editando === 'true') return;
  li.dataset.editando = 'true';

  const original = span.textContent;
  const originalPrior = prioDe(t);
  const originalVence = (t && typeof t.vence === 'string') ? t.vence : '';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex:1; gap:8px; flex-wrap:wrap; align-items:center;';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = original;
  input.style.cssText = 'flex:2 1 160px; font-size:16px; padding:4px 8px; border:1.5px solid var(--accent2); border-radius:8px; background:var(--input-bg); color:var(--text); outline:none;';

  const selPr = document.createElement('select');
  selPr.style.cssText = 'flex:0 1 90px; padding:4px 6px; border:1.5px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--text); font-size:13px; font-family:inherit;';
  const opA = document.createElement('option'); opA.value = 'alta'; opA.textContent = 'Alta'; selPr.appendChild(opA);
  const opM = document.createElement('option'); opM.value = 'media'; opM.textContent = 'Media'; selPr.appendChild(opM);
  const opB = document.createElement('option'); opB.value = 'baja'; opB.textContent = 'Baja'; selPr.appendChild(opB);
  selPr.value = originalPrior;

  const inpDate = document.createElement('input');
  inpDate.type = 'date';
  inpDate.style.cssText = 'flex:0 1 140px; padding:4px 6px; border:1.5px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--text); font-size:13px; font-family:inherit;';
  inpDate.value = originalVence;

  wrap.appendChild(input);
  wrap.appendChild(selPr);
  wrap.appendChild(inpDate);

  const btnGuardar = document.createElement('button');
  btnGuardar.type = 'button';
  btnGuardar.textContent = '✓';
  btnGuardar.title = 'Guardar';
  btnGuardar.style.cssText = 'flex:0 0 36px; height:36px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; display:grid; place-items:center; transition:filter .2s, transform .15s;';
  btnGuardar.onmouseenter = () => btnGuardar.style.filter = 'brightness(1.1)';
  btnGuardar.onmouseleave = () => btnGuardar.style.filter = 'none';
  btnGuardar.onmousedown = () => btnGuardar.style.transform = 'scale(.95)';
  btnGuardar.onmouseup = () => btnGuardar.style.transform = 'none';
  wrap.appendChild(btnGuardar);

  const guardar = async () => {
    const editando = li.dataset.editando === 'true';
    if (!editando) return;
    li.dataset.editando = 'false';
    const nuevo = input.value.trim();
    const nuevoPr = selPr.value;
    const nuevoV = inpDate.value;
    if (!nuevo) {
      span.textContent = original;
      if (wrap.isConnected) li.replaceChild(span, wrap);
      return;
    }
    const prValid = (nuevoPr === 'alta' || nuevoPr === 'media' || nuevoPr === 'baja') ? nuevoPr : 'media';
    const vValid = /^\d{4}-\d{2}-\d{2}$/.test(nuevoV) ? nuevoV : '';
    try {
      await api('/api/tareas/' + t.id, { method:'PATCH', body: JSON.stringify({ texto: nuevo, prioridad: prValid, vence: vValid }) });
      t.texto = nuevo;
      t.prioridad = prValid;
      t.vence = vValid;
      span.textContent = nuevo;
      cargar();
    } catch (e) {
      span.textContent = original;
    }
    if (wrap.isConnected) li.replaceChild(span, wrap);
  };

  const cancelar = () => {
    li.dataset.editando = 'false';
    span.textContent = original;
    if (wrap.isConnected) li.replaceChild(span, wrap);
  };

  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); guardar(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelar(); }
  };
  btnGuardar.onclick = guardar;
  selPr.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); guardar(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelar(); }
  };
  inpDate.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); guardar(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelar(); }
  };
  input.onblur = () => {};
  selPr.onblur = () => {};
  inpDate.onblur = () => {};

  li.replaceChild(wrap, span);
  input.focus();
  input.select();
}

async function cargar() {
  const tareas = await (await api('/api/tareas')).json();
  tareasGuardadas = Array.isArray(tareas) ? tareas : [];
  render();
}

function actualizarStats(tareas) {
  const lista = Array.isArray(tareas) ? tareas : [];
  const pend = lista.filter(t => !t.hecha).length;
  const total = lista.length;
  const hoy = new Date();
  const hechasHoy = lista.filter(t => {
    if (!t.hecha) return false;
    const c = t.completada;
    if (typeof c !== 'string' || !c) return false;
    const d = new Date(c);
    if (isNaN(d.getTime())) return false;
    return d.getFullYear() === hoy.getFullYear() && d.getMonth() === hoy.getMonth() && d.getDate() === hoy.getDate();
  }).length;
  const pct = total ? Math.round(lista.filter(t => t.hecha).length / total * 100) : 0;
  $('#statPend').textContent = String(pend);
  $('#statHoy').textContent = String(hechasHoy);
  $('#statProg').textContent = pct + '%';
  $('#statBarra').style.width = pct + '%';
  const wrap = $('#statBarraWrap');
  if (wrap) wrap.setAttribute('aria-valuenow', String(pct));
  const vencidas = lista.filter(esVencida).length;
  const aviso = $('#statsAviso');
  if (vencidas > 0) {
    aviso.textContent = '⚠️ ' + vencidas + ' tarea' + (vencidas === 1 ? '' : 's') + ' vencida' + (vencidas === 1 ? '' : 's');
    aviso.hidden = false;
  } else {
    aviso.textContent = '';
    aviso.hidden = true;
  }
}

function render() {
  const tareas = tareasGuardadas;
  const ul = $('#lista');
  ul.textContent = '';
  pintarFiltros();
  actualizarStats(tareas);

  if (!selectorOrdenCreado) {
    const contOrden = document.createElement('div');
    contOrden.style.marginBottom = '10px';
    contOrden.appendChild(crearSelectorOrden());
    const filtrosDiv = $('#filtros');
    if (filtrosDiv.parentNode) filtrosDiv.parentNode.insertBefore(contOrden, ul);
    contOrdenRef = contOrden;
    selectorOrdenCreado = true;
  } else {
    const sel = $('#ordenSel');
    if (sel) sel.value = orden;
  }

  let visibles = tareas;
  if (filtro) visibles = visibles.filter(t => catDe(t) === filtro);
  if (estado === 'pendientes') visibles = visibles.filter(t => !t.hecha);
  else if (estado === 'completadas') visibles = visibles.filter(t => !!t.hecha);
  const q = sinAcentos(busqueda.trim());
  if (q) visibles = visibles.filter(t => sinAcentos(t.texto || '').indexOf(q) !== -1);

  visibles = visibles.slice().sort((a,b) => {
    if (orden === 'alfabetico') {
      return a.texto.localeCompare(b.texto, 'es');
    }
    if (orden === 'prioridad') {
      const map = {alta:3, media:2, baja:1};
      const pa = map[prioDe(a)], pb = map[prioDe(b)];
      if (pa !== pb) return pb - pa;
    }
    if (orden === 'vence') {
      const fa = (a.vence && /^\d{4}-\d{2}-\d{2}$/.test(a.vence)) ? new Date(a.vence + 'T00:00:00').getTime() : Infinity;
      const fb = (b.vence && /^\d{4}-\d{2}-\d{2}$/.test(b.vence)) ? new Date(b.vence + 'T00:00:00').getTime() : Infinity;
      if (fa !== fb) return fa - fb;
    }
    if (orden === 'recientes') {
      const ca = a.creada ? new Date(a.creada).getTime() : 0;
      const cb = b.creada ? new Date(b.creada).getTime() : 0;
      if (ca !== cb) return cb - ca;
    }
    return 0;
  });

  if (!visibles.length) {
    const li = document.createElement('li');
    li.className = 'vacio';
    li.textContent = !tareas.length
      ? 'No tienes tareas. ¡Agrega la primera! 🎉'
      : 'No hay tareas que coincidan con los filtros';
    ul.appendChild(li);
  } else {
    for (const t of visibles) {
      const li = document.createElement('li');
      if (t.hecha) li.className = 'hecha';

      const check = document.createElement('button');
      check.className = 'check';
      check.type = 'button';
      check.title = t.hecha ? 'Marcar pendiente' : 'Marcar hecha';
      check.textContent = t.hecha ? '✓' : '';
      check.onclick = async () => {
        await api('/api/tareas/' + t.id, { method:'PATCH', body: JSON.stringify({ hecha: !t.hecha }) });
        cargar();
      };

      const texto = document.createElement('span');
      texto.className = 'texto';
      texto.textContent = t.texto;

      const edit = document.createElement('button');
      edit.className = 'del';
      edit.type = 'button';
      edit.title = 'Editar';
      edit.textContent = '✏️';
      edit.onclick = () => activarEdicion(li, texto, t);

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.title = 'Eliminar';
      del.textContent = '✕';
      del.onclick = async () => {
        await api('/api/tareas/' + t.id, { method:'DELETE' });
        cargar();
      };

      texto.ondblclick = () => activarEdicion(li, texto, t);

      const pr = prioDe(t);
      const prCol = PRIOR_COLOR[pr];
      const prInd = document.createElement('span');
      prInd.title = 'Prioridad: ' + pr;
      prInd.style.cssText = 'width:6px; height:40px; border-radius:3px; background:' + prCol + '; flex-shrink:0;';

      const meta = document.createElement('div');
      meta.style.cssText = 'display:flex; align-items:center; gap:6px; flex-wrap:wrap;';
      const chipV = document.createElement('span');
      const vtxt = fmtFechaCorta(t.vence);
      const vencida = esVencida(t);
      if (vtxt) {
        chipV.textContent = vencida ? 'Vencida · ' + vtxt : vtxt;
        chipV.style.cssText = 'padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; background:' + (vencida ? 'var(--danger-bg)' : 'var(--icon-bg)') + '; color:' + (vencida ? 'var(--danger)' : 'var(--muted)') + '; border:' + (vencida ? '1px solid var(--danger)' : '1px solid var(--line)') + ';';
      }

      if (vtxt) meta.appendChild(chipV);
      meta.appendChild(crearEtiqueta(t));

      li.append(check, prInd, texto, meta, edit, del);
      if (vencida) {
        li.style.background = 'var(--danger-bg)';
        li.style.borderLeft = '3px solid var(--danger)';
      }
      ul.appendChild(li);
    }
  }

  const pend = tareas.filter(t => !t.hecha).length;
  $('#contador').textContent = `${pend} pendiente${pend === 1 ? '' : 's'} de ${tareas.length}`;
}

function actualizarSegmentado() {
  const btns = document.querySelectorAll('.seg-btn');
  for (const btn of btns) {
    btn.classList.toggle('activo', btn.dataset.estado === estado);
  }
}

(function initSegmentado() {
  const btns = document.querySelectorAll('.seg-btn');
  for (const btn of btns) {
    btn.onclick = () => {
      if (estado === btn.dataset.estado) return;
      estado = btn.dataset.estado;
      localStorage.setItem(ESTADO_KEY, estado);
      actualizarSegmentado();
      render();
    };
  }
  actualizarSegmentado();
})();

$('#buscar').oninput = e => {
  busqueda = e.target.value;
  render();
};

$('#form').onsubmit = async e => {
  e.preventDefault();
  const texto = $('#nueva').value.trim();
  if (!texto) return;
  const pr = $('#priorNueva').value;
  const prOk = (pr === 'alta' || pr === 'media' || pr === 'baja') ? pr : 'media';
  const v = $('#venceNueva').value;
  const vOk = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
  await api('/api/tareas', { method:'POST', body: JSON.stringify({ texto, categoria: $('#catNueva').value, prioridad: prOk, vence: vOk }) });
  $('#nueva').value = '';
  $('#catNueva').value = '';
  $('#priorNueva').value = 'media';
  $('#venceNueva').value = '';
  cargar();
};

$('#limpiar').onclick = async () => {
  await api('/api/tareas?hechas=1', { method:'DELETE' });
  cargar();
};

cargar();
</script>
</body>
</html>
