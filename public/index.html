<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tareas</title>
<style>
  :root { --bg:#f3f4f8; --card:#fff; --text:#1f2333; --muted:#8a8fa3; --accent:#6c5ce7; --accent2:#a29bfe; --danger:#e5534b; --line:#eceef4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg, #e9e6ff 0%, var(--bg) 50%, #e3f4ff 100%); color:var(--text);
         display:flex; justify-content:center; align-items:flex-start; padding:56px 16px; }
  .card { width:100%; max-width:520px; background:var(--card); border-radius:20px; padding:28px;
          box-shadow: 0 20px 50px rgba(60,50,140,.12); }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  form { display:flex; gap:10px; margin-bottom:18px; }
  input[type=text] { flex:1; padding:13px 16px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; outline:none; transition:border .2s; }
  input[type=text]:focus { border-color:var(--accent2); }
  button.add { padding:0 20px; border:0; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2));
               color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  button.add:hover { filter:brightness(1.07); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  .check { width:22px; height:22px; border-radius:50%; border:2px solid var(--accent2); background:none; cursor:pointer;
           display:grid; place-items:center; color:#fff; font-size:13px; flex-shrink:0; padding:0; }
  li.hecha .check { background:var(--accent); border-color:var(--accent); }
  .texto { flex:1; font-size:15px; word-break:break-word; }
  li.hecha .texto { text-decoration:line-through; color:var(--muted); }
  .del { border:0; background:none; color:var(--muted); font-size:18px; cursor:pointer; opacity:.5; border-radius:8px; padding:4px 8px; }
  li:hover .del { opacity:1; } .del:hover { color:var(--danger); background:#fdecea; }
  .vacio { text-align:center; color:var(--muted); padding:28px 0; font-size:14px; }
  footer { display:flex; justify-content:space-between; margin-top:16px; font-size:13px; color:var(--muted); }
  footer button { border:0; background:none; color:var(--muted); cursor:pointer; font-size:13px; }
  footer button:hover { color:var(--danger); }
</style>
</head>
<body>
<main class="card">
  <h1>Mis tareas ✓</h1>
  <p class="sub" id="fecha"></p>
  <form id="form">
    <input type="text" id="nueva" placeholder="¿Qué necesitas hacer?" maxlength="200" autocomplete="off" autofocus>
    <button class="add" type="submit">Agregar</button>
  </form>
  <ul id="lista"></ul>
  <footer><span id="contador"></span><button id="limpiar">Borrar completadas</button></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (url, opts={}) => fetch(url, { headers:{'Content-Type':'application/json'}, ...opts });
$('#fecha').textContent = new Date().toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });

async function cargar() {
  const tareas = await (await api('/api/tareas')).json();
  const ul = $('#lista'); ul.innerHTML = '';
  if (!tareas.length) ul.innerHTML = '<li class="vacio">No tienes tareas. ¡Agrega la primera! 🎉</li>';
  for (const t of tareas) {
    const li = document.createElement('li'); if (t.hecha) li.className = 'hecha';
    li.innerHTML = `<button class="check" title="Marcar">${t.hecha ? '✓' : ''}</button><span class="texto"></span><button class="del" title="Eliminar">✕</button>`;
    li.querySelector('.texto').textContent = t.texto;
    li.querySelector('.check').onclick = async () => { await api('/api/tareas/' + t.id, { method:'PATCH', body: JSON.stringify({ hecha: !t.hecha }) }); cargar(); };
    li.querySelector('.del').onclick = async () => { await api('/api/tareas/' + t.id, { method:'DELETE' }); cargar(); };
    ul.appendChild(li);
  }
  const pend = tareas.filter(t => !t.hecha).length;
  $('#contador').textContent = `${pend} pendiente${pend === 1 ? '' : 's'} de ${tareas.length}`;
}
$('#form').onsubmit = async e => {
  e.preventDefault(); const texto = $('#nueva').value.trim(); if (!texto) return;
  await api('/api/tareas', { method:'POST', body: JSON.stringify({ texto }) }); $('#nueva').value = ''; cargar();
};
$('#limpiar').onclick = async () => { await api('/api/tareas?hechas=1', { method:'DELETE' }); cargar(); };
cargar();
</script>
</body>
</html>
